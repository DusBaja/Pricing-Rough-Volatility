[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricer"
version = "0.1.0"
description = "Rough volatility pricing & calibration framework"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "openpyxl",
]

[project.scripts]
pricer = "pricer.main:main"
pricer-calibrate = "pricer.calibrate:main"
